<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZEESHAM Ai</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #0b0f19;
      color: #ffffff;
      height: 100vh;
      overflow: hidden;
    }

    .app {
      display: flex;
      height: 100vh;
    }

    /* SIDEBAR */

    .sidebar {
      width: 260px;
      background: #111827;
      border-right: 1px solid #263043;
      padding: 18px;
      display: flex;
      flex-direction: column;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 25px;
    }

    .logo span {
      color: #6c63ff;
    }

    .new-chat {
      width: 100%;
      padding: 13px;
      border-radius: 10px;
      border: 1px solid #39445a;
      background: #1b2333;
      color: white;
      cursor: pointer;
      font-size: 15px;
      margin-bottom: 20px;
    }

    .new-chat:hover {
      background: #252f43;
    }

    .side-title {
      color: #8993a7;
      font-size: 12px;
      margin: 10px 5px;
      text-transform: uppercase;
    }

    .side-item {
      padding: 10px;
      border-radius: 8px;
      color: #cbd2df;
      cursor: pointer;
      font-size: 14px;
    }

    .side-item:hover {
      background: #1d2637;
    }

    .bottom {
      margin-top: auto;
      border-top: 1px solid #263043;
      padding-top: 15px;
    }

    /* MAIN */

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .topbar {
      height: 65px;
      border-bottom: 1px solid #263043;
      display: flex;
      align-items: center;
      padding: 0 22px;
      font-weight: bold;
      font-size: 18px;
    }

    .topbar span {
      color: #6c63ff;
      margin-left: 5px;
    }

    .chat {
      flex: 1;
      overflow-y: auto;
      padding: 35px 20px;
    }

    .welcome {
      max-width: 800px;
      margin: 80px auto;
      text-align: center;
    }

    .welcome-icon {
      width: 70px;
      height: 70px;
      margin: auto;
      border-radius: 20px;
      background: linear-gradient(135deg, #6c63ff, #9c6cff);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      font-weight: bold;
      box-shadow: 0 10px 35px rgba(108, 99, 255, 0.25);
    }

    .welcome h1 {
      font-size: 34px;
      margin: 22px 0 10px;
    }

    .welcome p {
      color: #9ba5b7;
      font-size: 16px;
    }

    /* MESSAGES */

    .message {
      max-width: 850px;
      margin: 0 auto 22px;
      display: flex;
      gap: 13px;
    }

    .avatar {
      min-width: 38px;
      height: 38px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: bold;
    }

    .user-avatar {
      background: #263043;
    }

    .ai-avatar {
      background: linear-gradient(135deg, #6c63ff, #9c6cff);
    }

    .message-content {
      line-height: 1.6;
      white-space: pre-wrap;
      padding-top: 6px;
    }

    /* INPUT */

    .input-area {
      padding: 15px 20px 20px;
      border-top: 1px solid #263043;
      background: #0b0f19;
    }

    .input-box {
      max-width: 850px;
      margin: auto;
      position: relative;
    }

    textarea {
      width: 100%;
      min-height: 58px;
      max-height: 180px;
      resize: none;
      padding: 17px 60px 17px 18px;
      border-radius: 15px;
      border: 1px solid #374257;
      outline: none;
      background: #151c2a;
      color: white;
      font-size: 15px;
      font-family: inherit;
    }

    textarea:focus {
      border-color: #6c63ff;
    }

    textarea::placeholder {
      color: #7e889b;
    }

    .send {
      position: absolute;
      right: 9px;
      bottom: 9px;
      width: 40px;
      height: 40px;
      border: none;
      border-radius: 10px;
      background: #6c63ff;
      color: white;
      cursor: pointer;
      font-size: 18px;
    }

    .send:hover {
      background: #7c74ff;
    }

    .send:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .notice {
      text-align: center;
      color: #687386;
      font-size: 11px;
      margin-top: 9px;
    }

    /* MOBILE */

    @media (max-width: 700px) {
      .sidebar {
        display: none;
      }

      .welcome {
        margin: 60px auto;
      }

      .welcome h1 {
        font-size: 28px;
      }

      .chat {
        padding: 20px 12px;
      }

      .input-area {
        padding: 12px;
      }
    }
  </style>
</head>

<body>

  <div class="app">

    <aside class="sidebar">

      <div class="logo">
        ZEESHAM<span> Ai</span>
      </div>

      <button class="new-chat" onclick="newChat()">
        + New chat
      </button>

      <div class="side-title">
        Explore
      </div>

      <div class="side-item">
        Chat
      </div>

      <div class="side-item">
        AI Assistant
      </div>

      <div class="side-item">
        Settings
      </div>

      <div class="bottom">
        <div class="side-item">
          About ZEESHAM Ai
        </div>
