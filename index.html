<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZEESHAM Ai</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0f19;
      color: white;
      height: 100vh;
    }

    .app {
      display: flex;
      height: 100vh;
    }

    .sidebar {
      width: 250px;
      background: #111827;
      padding: 20px;
      border-right: 1px solid #293246;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 25px;
    }

    .logo span {
      color: #6c63ff;
    }

    button {
      cursor: pointer;
    }

    .new-chat {
      width: 100%;
      padding: 13px;
      border-radius: 10px;
      border: 1px solid #39445a;
      background: #1b2333;
      color: white;
      font-size: 15px;
      margin-bottom: 25px;
    }

    .item {
      padding: 12px;
      margin: 5px 0;
      border-radius: 8px;
      color: #cbd2df;
      cursor: pointer;
    }

    .item:hover {
      background: #1d2637;
    }

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .top {
      height: 65px;
      border-bottom: 1px solid #293246;
      display: flex;
      align-items: center;
      padding: 0 25px;
      font-size: 18px;
      font-weight: bold;
    }

    .top span {
      color: #6c63ff;
      margin-left: 5px;
    }

    .chat {
      flex: 1;
      overflow-y: auto;
      padding: 30px 20px 100px;
    }

    .welcome {
      max-width: 700px;
      margin: 100px auto;
      text-align: center;
    }

    .icon {
      width: 75px;
      height: 75px;
      border-radius: 22px;
      background: linear-gradient(135deg, #6c63ff, #9b6cff);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: auto;
      font-size: 32px;
      font-weight: bold;
    }

    h1 {
      font-size: 34px;
      margin: 25px 0 10px;
    }

    .welcome p {
      color: #9ba5b7;
    }

    .message {
      max-width: 800px;
      margin: 20px auto;
      display: flex;
      gap: 12px;
    }

    .avatar {
      width: 38px;
      height: 38px;
      min-width: 38px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: bold;
      background: #6c63ff;
    }

    .user {
      background: #263043;
    }

    .text {
      padding-top: 8px;
      line-height: 1.6;
      white-space: pre-wrap;
    }

    .input-area {
      padding: 15px 20px 20px;
      border-top: 1px solid #293246;
    }

    .input-box {
      max-width: 800px;
      margin: auto;
      position: relative;
    }

    textarea {
      width: 100%;
      height: 60px;
      resize: none;
      border: 1px solid #39445a;
      border-radius: 15px;
      background: #151c2a;
      color: white;
      padding: 18px 60px 18px 18px;
      outline: none;
      font-size: 15px;
    }

    textarea:focus {
      border-color: #6c63ff;
    }

    .send {
      position: absolute;
      right: 10px;
      bottom: 10px;
      width: 40px;
      height: 40px;
      border: 0;
      border-radius: 10px;
      background: #6c63ff;
      color: white;
      font-size: 20px;
    }

    .send:hover {
      background: #8179ff;
    }

    .small {
      text-align: center;
      color: #687386;
      font-size: 11px;
      margin-top: 8px;
    }

    @media(max-width:700px) {
      .sidebar {
        display: none;
      }

      h1 {
        font-size: 28px;
      }

      .welcome {
        margin: 60px auto;
      }

      .input-area {
        padding: 10px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <div class="sidebar">

    <div class="logo">
      ZEESHAM<span> Ai</span>
    </div>

    <button class="new-chat" onclick="newChat()">
      + New Chat
    </button>

    <div class="item" onclick="showHome()">Chat</div>

    <div class="item" onclick="showAI()">AI</div>

    <div class="item" onclick="showSettings()">Settings</div>

    <div class="item" onclick="showAbout()">About ZEESHAM Ai</div>

  </div>

  <div class="main">

    <div class="top">
      ZEESHAM <span>Ai</span>
    </div>

    <div class="chat" id="chat">

      <div class="welcome" id="welcome">

        <div class="icon">Z</div>

        <h1>Welcome to ZEESHAM Ai</h1>

        <p>
          Your intelligent AI assistant.
          Ask anything and let's get started.
        </p>

      </div>

    </div>

    <div class="input-area">

      <div class="input-box">

        <textarea
          id="input"
          placeholder="Message ZEESHAM Ai..."
        ></textarea>

        <button class="send" onclick="sendMessage()">
          ↑
        </button>

      </div>

      <div class="small">
        ZEESHAM Ai can make mistakes. Check important information.
      </div>

    </div>

  </div>

</div>

<script>

function sendMessage() {

  const input = document.getElementById("input");

  const message = input.value.trim();

  if (message === "") {
    return;
  }

  const welcome = document.getElementById("welcome");

  if (welcome) {
    welcome.remove();
  }

  addMessage(message, "user");

  input.value = "";

  setTimeout(function() {

    addMessage(
      "Hello! I'm ZEESHAM Ai. The chat interface is working. The real AI engine will be connected next.",
      "ai"
    );

  }, 500);

}

function addMessage(message, type) {

  const chat = document.getElementById("chat");

  const row = document.createElement("div");

  row.className = "message";

  const avatar = document.createElement("div");

  avatar.className =
    "avatar " +
    (type === "user" ? "user" : "");

  avatar.textContent =
    type === "user" ? "YOU" : "Z";

  const text = document.createElement("div");

  text.className = "text";

  text.textContent = message;

  row.appendChild(avatar);

  row.appendChild(text);

  chat.appendChild(row);

  chat.scrollTop = chat.scrollHeight;

}

function newChat() {

  document.getElementById("chat").innerHTML = `

    <div class="welcome" id="welcome">

      <div class="icon">Z</div>

      <h1>Welcome to ZEESHAM Ai</h1>

      <p>
        Your intelligent AI assistant.
        Ask anything and let's get started.
      </p>

    </div>

  `;

}

function showHome() {

  newChat();

}

function showAI() {

  alert("ZEESHAM Ai engine will be connected here.");

}

function showSettings() {

  alert("Settings will be added here.");

}

function showAbout() {

  alert("ZEESHAM Ai — your intelligent AI assistant.");

}

document.getElementById("input").addEventListener(
  "keydown",
  function(event) {

    if (event.key === "Enter" && !event.shiftKey) {

      event.preventDefault();

      sendMessage();

    }

  }
);

</script>

</body>
</html>
